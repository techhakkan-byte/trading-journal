 --gtr:96 100 104;--gir:16 18 20;--gia:.26;--glr:255 255 255;--gla:.055;--gl1:rgb(var(--gtr) / var(--ga));--gl1b:rgba(255,255,255,.12);--gin:rgb(var(--gir) / var(--gia));--ginb:rgba(255,255,255,.07);--gl2:rgb(var(--glr) / var(--gla));--gl3:rgb(var(--glr) / calc(var(--gla) + .035));--glh:rgba(255,255,255,.15);

 --gtr:255 255 255;--gir:248 249 248;--gia:.42;--glr:255 255 255;--gla:.55;--gl1:rgb(var(--gtr) / calc(var(--ga) + .12));--gl1b:rgba(255,255,255,.85);--gin:rgb(var(--gir) / var(--gia));--ginb:rgba(255,255,255,.9);--gl2:rgb(var(--glr) / var(--gla));--gl3:rgb(var(--glr) / calc(var(--gla) + .1));--glh:rgba(255,255,255,.97);
